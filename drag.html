<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Domino Double Face — Tapis</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: #12131a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        .container {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 32px;
        }

        .square {
            width: 120px;
            height: 120px;
            background-color: transparent;
            border: 1px solid rgba(180, 180, 190, 0.35);
            border-radius: 18px;
            overflow: hidden;
            cursor: grab;
            position: relative;
            touch-action: none;
            transition: transform 400ms cubic-bezier(0.25, 0.1, 0.25, 1);
        }

        .square:active { cursor: grabbing; }

        .square svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        .square.swiping-up { border-color: rgba(140, 180, 255, 0.45); }
        .square.swiping-down { border-color: rgba(255, 180, 140, 0.45); }

        .counter {
            font-size: 11px;
            letter-spacing: 2px;
            color: rgba(180, 180, 190, 0.2);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="square" id="domino">
            <svg id="dominoSvg" viewBox="0 0 90 90"></svg>
        </div>
        <div class="counter" id="counter"></div>
    </div>

    <script>
        // ─── Bibliothèque de sigles (tapis infini) ───
        const ICONS = [
            `<path d="M 20 32 L 45 12 L 70 32"/>`,                      // chevronUp
            `<circle cx="45" cy="22" r="12"/>`,                          // circle
            `<circle cx="30" cy="22" r="8"/><circle cx="60" cy="22" r="8"/>`, // twoCircles
            `<line x1="15" y1="22" x2="75" y2="22"/>`,                  // line
            `<line x1="25" y1="10" x2="25" y2="34"/><line x1="45" y1="10" x2="45" y2="34"/><line x1="65" y1="10" x2="65" y2="34"/>`, // threeLines
            `<path d="M 10 30 Q 28 8 45 22 Q 62 36 80 14"/>`,           // waveUp
            `<path d="M 45 8 L 70 22 L 45 36 L 20 22 Z"/>`,            // diamond
            `<line x1="25" y1="10" x2="65" y2="34"/><line x1="65" y1="10" x2="25" y2="34"/>`, // cross
            `<rect x="25" y="8" width="40" height="28" rx="3"/>`,       // square
            `<path d="M 45 8 L 70 36 L 20 36 Z"/>`,                     // triangle
            `<path d="M 10 30 L 25 10 L 45 30 L 65 10 L 80 30"/>`,     // zigzag
            `<path d="M 20 12 L 45 32 L 70 12"/>`,                      // chevronDown
            `<path d="M 10 14 Q 28 36 45 22 Q 62 8 80 30"/>`,          // waveDown
            `<circle cx="30" cy="14" r="4"/><circle cx="60" cy="14" r="4"/><circle cx="30" cy="30" r="4"/><circle cx="60" cy="30" r="4"/>`, // dots4
            `<circle cx="45" cy="12" r="4"/><circle cx="30" cy="32" r="4"/><circle cx="60" cy="32" r="4"/>`, // threePoints
            `<circle cx="30" cy="22" r="4"/><circle cx="60" cy="22" r="4"/>`, // twoPoints
        ];

        const TOTAL = ICONS.length;
        const wrap = (i) => ((i % TOTAL) + TOTAL) % TOTAL;

        const SLOT = 45;
        const ICON_AREA = 44;
        const STEP_GESTURE = SLOT / 2;       // distance de geste pour 1 cran logique
        const VISUAL_RATIO = SLOT / STEP_GESTURE; // = 2 : la bande défile 2x plus que le doigt

        // topIdx : index entier du sigle "top" affiché au repos
        // bandY : position visuelle continue de la bande (en px). Au repos = topIdx * SLOT.
        // Le sigle k de la bande est affiché à y = k*SLOT - bandY dans la fenêtre.
        let topIdx = 0;
        let bandY = 0;

        // Rotation (multiple de 90°). 0 = vertical normal, 90/180/270 = tournés.
        let rotation = 0;

        const svg = document.getElementById('dominoSvg');
        const domino = document.getElementById('domino');
        const counterEl = document.getElementById('counter');

        // Selon la rotation (sens horaire), l'axe de drag change.
        // "Avancer dans la séquence" = doigt va dans la direction où la bande se déplace.
        // À 0°   (haut en haut)    : avancer = doigt monte (dy<0). delta = dy.
        // À 90°  (haut à droite)   : avancer = doigt à droite (dx>0). delta = -dx.
        // À 180° (haut en bas)     : avancer = doigt descend (dy>0). delta = -dy.
        // À 270° (haut à gauche)   : avancer = doigt à gauche (dx<0). delta = dx.
        // Note : delta < 0 = avancer (cohérent avec la logique d'origine où dy<0 = avancer)
        function getDragDelta(dx, dy) {
            switch (((rotation % 360) + 360) % 360) {
                case 0:   return dy;
                case 90:  return -dx;
                case 180: return -dy;
                case 270: return dx;
                default:  return dy;
            }
        }

        // ─── Rendu ───
        // Le sigle k est affiché à y = k*SLOT - bandY
        // À bandY = topIdx * SLOT : sigle topIdx en haut (y=0), sigle topIdx+1 en bas (y=SLOT). Médiane au centre.
        const SLOT_HEIGHT = SLOT;
        const ICON_HEIGHT = ICON_AREA;

        function renderFrame() {
            // Quels sigles dessiner ? On veut couvrir y ∈ [-SLOT, 90+SLOT]
            const kMin = Math.floor((bandY - SLOT) / SLOT);
            const kMax = Math.ceil((bandY + 90 + SLOT) / SLOT);

            let content = `<defs><clipPath id="vis"><rect x="0" y="0" width="90" height="90"/></clipPath></defs>`;
            content += `<g clip-path="url(#vis)">`;

            for (let k = kMin; k <= kMax; k++) {
                const slotTop = k * SLOT - bandY;
                const slotCenter = slotTop + SLOT / 2;
                const iconY = slotCenter - ICON_AREA / 2;

                if (slotTop > 95 || slotTop + SLOT < -5) continue;

                const distFromCenter = Math.abs(slotCenter - 45) / SLOT;
                const opacity = Math.max(0.15, 1 - distFromCenter * 0.4);

                content += `<g transform="translate(0, ${iconY.toFixed(2)})" opacity="${opacity.toFixed(2)}">
                    ${applyStyle(ICONS[wrap(k)])}
                </g>`;

                // Médiane en bas du slot k
                const sepY = slotTop + SLOT;
                if (sepY > -2 && sepY < 92) {
                    const sepDist = Math.abs(sepY - 45) / 45;
                    const sepOpacity = Math.max(0.08, 0.3 - sepDist * 0.2);
                    content += `<line x1="8" y1="${sepY.toFixed(2)}" x2="82" y2="${sepY.toFixed(2)}" 
                        stroke="rgba(180,180,190,${sepOpacity.toFixed(2)})" stroke-width="0.8"/>`;
                }
            }

            content += `</g>`;
            svg.innerHTML = content;
        }

        function applyStyle(iconSvg) {
            return iconSvg
                .replace(/<(path|line|rect|polygon)/g, '<$1 stroke="rgba(180,180,190,0.55)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"')
                .replace(/<circle cx/g, '<circle fill="rgba(180,180,190,0.55)" stroke="none" cx');
        }

        function updateCounter() {
            const t = wrap(topIdx);
            const b = wrap(topIdx + 1);
            counterEl.textContent = `${t + 1}·${b + 1} / ${TOTAL}`;
        }

        // ─── Animation ───
        let animating = false;

        function animateBandY(targetBandY, duration) {
            if (animating) return;
            animating = true;
            const startBandY = bandY;
            const delta = targetBandY - startBandY;
            const startTime = performance.now();

            function tick(now) {
                const elapsed = now - startTime;
                const progress = Math.min(elapsed / duration, 1);
                const ease = 1 - Math.pow(1 - progress, 3);
                bandY = startBandY + delta * ease;
                renderFrame();

                if (progress < 1) {
                    requestAnimationFrame(tick);
                } else {
                    bandY = targetBandY;          // garantie : pile sur la cible
                    topIdx = Math.round(bandY / SLOT);
                    renderFrame();
                    updateCounter();
                    animating = false;
                }
            }

            requestAnimationFrame(tick);
        }

        function animateScroll(direction) {
            if (animating) return;
            const targetTopIdx = topIdx + (direction === 'up' ? 1 : -1);
            animateBandY(targetTopIdx * SLOT, 280);
        }

        // ─── Drag + clic ───
        let startX = 0, startY = 0;
        let bandYAtDragStart = 0;
        let isDragging = false;
        let totalMovement = 0; // pour distinguer clic vs drag
        const CLICK_THRESHOLD = 5; // px

        domino.addEventListener('pointerdown', (e) => {
            if (animating) return;
            startX = e.clientX;
            startY = e.clientY;
            bandYAtDragStart = bandY;
            isDragging = true;
            totalMovement = 0;
            domino.setPointerCapture(e.pointerId);
        });

        domino.addEventListener('pointermove', (e) => {
            if (!isDragging || animating) return;
            const dx = e.clientX - startX;
            const dy = e.clientY - startY;
            totalMovement = Math.max(totalMovement, Math.hypot(dx, dy));

            const delta = getDragDelta(dx, dy);
            // delta < 0 = avancer (bandY augmente)
            bandY = bandYAtDragStart - delta * VISUAL_RATIO;

            const drift = bandY - bandYAtDragStart;
            if (drift > 2) {
                domino.classList.add('swiping-up');
                domino.classList.remove('swiping-down');
            } else if (drift < -2) {
                domino.classList.add('swiping-down');
                domino.classList.remove('swiping-up');
            } else {
                domino.classList.remove('swiping-up', 'swiping-down');
            }

            renderFrame();
        });

        domino.addEventListener('pointerup', (e) => {
            if (!isDragging) return;
            isDragging = false;
            domino.classList.remove('swiping-up', 'swiping-down');

            if (totalMovement < CLICK_THRESHOLD) {
                // Clic : rotation +90°
                rotation += 90;
                domino.style.transform = `rotate(${rotation}deg)`;
            } else {
                snapToNearest();
            }
        });

        domino.addEventListener('pointercancel', () => {
            if (!isDragging) return;
            isDragging = false;
            domino.classList.remove('swiping-up', 'swiping-down');
            snapToNearest();
        });

        function snapToNearest() {
            // Le SLOT le plus proche en termes de bandY
            const targetTopIdx = Math.round(bandY / SLOT);
            const targetBandY = targetTopIdx * SLOT;
            const distance = Math.abs(targetBandY - bandY);

            if (distance < 0.5) {
                bandY = targetBandY;
                topIdx = targetTopIdx;
                renderFrame();
                updateCounter();
                return;
            }

            // Durée proportionnelle, plus rapide quand on est presque au snap
            const duration = Math.max(80, 220 * (distance / SLOT));
            animateBandY(targetBandY, duration);
        }

        // Scroll wheel
        domino.addEventListener('wheel', (e) => {
            e.preventDefault();
            if (e.deltaY > 0) animateScroll('up');
            else if (e.deltaY < 0) animateScroll('down');
        }, { passive: false });

        // ─── Init ───
        renderFrame();
        updateCounter();
    </script>
</body>
</html>
